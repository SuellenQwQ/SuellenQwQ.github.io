<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Suellen</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    font-family: "Segoe UI", system-ui, sans-serif;
    background: linear-gradient(135deg, #5BCEFA 0%, #F5A9B8 50%, #ffffff 100%);
    display: flex; align-items: center; justify-content: center;
    color: #2b2b2b;
  }
  .card {
    background: rgba(255, 255, 255, 0.82);
    backdrop-filter: blur(10px);
    border-radius: 24px;
    padding: 56px 64px;
    box-shadow: 0 20px 60px rgba(91, 206, 250, 0.35);
    text-align: center;
    max-width: 560px;
    margin: 24px;
  }
  .avatar {
    width: 96px; height: 96px; border-radius: 50%;
    background: linear-gradient(135deg, #5BCEFA, #F5A9B8);
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 44px; margin-bottom: 20px;
    box-shadow: 0 8px 24px rgba(245, 169, 184, 0.5);
  }
  h1 { font-size: 34px; margin-bottom: 8px; }
  .sub { font-size: 16px; opacity: .75; margin-bottom: 26px; line-height: 1.7; }
  .flag { font-size: 20px; }
  .links { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-top: 8px; }
  a.btn {
    display: inline-block; padding: 10px 22px; border-radius: 999px;
    text-decoration: none; font-weight: 600; color: #fff;
    background: linear-gradient(135deg, #5BCEFA, #F5A9B8);
    transition: transform .15s ease, box-shadow .15s ease;
    box-shadow: 0 4px 14px rgba(91, 206, 250, .4);
  }
  a.btn:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(245, 169, 184, .5); }
  footer { margin-top: 30px; font-size: 13px; opacity: .55; }
</style>
</head>
<body>
  <main class="card">
    <div class="avatar">&#128075;</div>
    <h1>Hi, I'm Suellen</h1>
    <p class="sub">
      <span class="flag">&#127987;&#65039;&#8205;&#9895;&#65039;</span>
      MtF &middot; she/her<br>
      NCUK Foundation &rarr; <b>UNSW</b>, Australia<br>
      learning Python by hunting bugs in open source<br><b>first PR merged upstream</b> &middot; 22 bugs found so far
    </p>
    <div class="links">
      <a class="btn" href="https://github.com/SuellenQwQ">GitHub</a>
      <a class="btn" href="https://github.com/SuellenQwQ/bug-hunting-kit">bug-hunting-kit</a>
    </div>
    <footer>made with &lt;3 and three colors</footer>
  </main>
</body>
</html>
